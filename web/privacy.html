    <h1>プライバシー</h1>
    <p>端末から選んだMLabの読書用ファイルをブラウザ内で読み込み、訳文・原文・図表を表示します。GoogleへのログインやDriveへのアクセス許可は不要です。</p>
    <p>論文データはタブのメモリで処理します。配信サーバーや翻訳・AIサービスへのファイル送信、ブラウザの永続ストレージへの保存、広告への利用は行いません。タブを閉じると表示データは破棄されます。</p>
    <p>お問い合わせはGitHubの開発元へお寄せください。公開のIssuesに論文や認証情報を記載しないでください。</p>
