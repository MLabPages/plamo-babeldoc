<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com https://apis.google.com https://docs.google.com https://www.gstatic.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; connect-src https://www.googleapis.com https://accounts.google.com https://apis.google.com https://docs.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src data:; base-uri 'none'; form-action 'none'">
  <title>MLab Webリーダー</title>
  <link rel="stylesheet" href="reader.css">
  <script defer src="config.js"></script>
  <script defer src="reader.js"></script>
</head>
<body>
  <header>
    <div class="toolbar">
      <strong>MLab Webリーダー</strong>
      <button id="drive" type="button" disabled>Google Driveから開く</button>
      <label class="file-button">端末のファイルを開く<input id="file" type="file" accept=".html,text/html"></label>
      <button id="disconnect" type="button" hidden>Google連携を解除</button>
      <a href="privacy.html">プライバシー</a>
    </div>
    <p id="status" role="status">MLab Web Libraryの読書用ファイル（.html）を選んでください。</p>
  </header>
  <main id="paper" aria-label="論文"></main>
</body>
</html>
