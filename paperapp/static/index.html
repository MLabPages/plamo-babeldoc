<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="論文リーダー">
<meta name="theme-color" content="#f7f4ee">
<title>PLaMo 論文リーダー</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="home" class="view">
  <header class="bar">
    <div class="brand"><span class="logo">訳</span>論文リーダー</div>
    <div class="grow"></div>
    <button id="btnShare" class="ghost local-only">iPadで読む</button>
    <button id="btnSettings" class="ghost">設定</button>
  </header>
  <main class="home">
    <div id="drop" class="drop">
      <p class="drop-title">論文PDFをここにドロップ</p>
      <div class="drop-row">
        <label class="btn primary">PDFを選ぶ<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden></label>
        <label class="engine">翻訳エンジン <select id="engineSel"></select></label>
      </div>
      <p id="engineNote" class="note"></p>
    </div>
    <h2 class="section">ライブラリ</h2>
    <div id="library" class="library"></div>
  </main>
</section>

<section id="reader" class="view hidden">
  <header class="bar reader-bar" id="readerBar">
    <button id="btnBack" class="ghost" title="ライブラリへ戻る">‹ 戻る</button>
    <div class="doc-title" id="docTitle"></div>
    <select id="readEngine" title="翻訳エンジン"></select>
    <div class="tabs" id="tabs">
      <button data-mode="read" class="on">読書</button>
      <button data-mode="pdf">PDF</button>
      <button data-mode="dual">対訳</button>
    </div>
    <button id="btnFocus" class="ghost" title="集中モード（F）">集中</button>
    <button id="btnDisplay" class="ghost" title="表示設定">Aa</button>
  </header>
  <div class="progress"><div id="progressFill"></div></div>
  <div id="readPane" class="read-pane">
    <article id="article"></article>
  </div>
  <div id="pdfPane" class="pdf-pane hidden">
    <iframe id="pdfFrame" title="PDF"></iframe>
    <a id="pdfOpen" class="btn pdf-open" target="_blank" rel="noopener">新しいタブで開く</a>
  </div>
  <div id="ttsBar" class="tts">
    <button id="ttsPrev" title="前の段落">⏮</button>
    <button id="ttsPlay" class="primary">▶ 読み上げ</button>
    <button id="ttsNext" title="次の段落">⏭</button>
    <label class="rate">速さ <input type="range" id="ttsRate" min="0.6" max="2.0" step="0.1"><span id="ttsRateVal"></span></label>
    <select id="ttsVoice" title="声"></select>
  </div>
  <div id="displayPanel" class="panel hidden">
    <div class="row"><span>背景</span>
      <div class="seg" id="themeSeg"><button data-v="light">白</button><button data-v="sepia">セピア</button><button data-v="dark">黒</button></div></div>
    <div class="row"><span>書体</span>
      <div class="seg" id="fontSeg"><button data-v="serif">明朝</button><button data-v="sans">ゴシック</button></div></div>
    <div class="row"><span>文字</span><input type="range" id="fontSize" min="14" max="30" step="1"></div>
    <div class="row"><span>行間</span><input type="range" id="lineHeight" min="1.5" max="2.4" step="0.1"></div>
    <div class="row"><span>幅</span><input type="range" id="colWidth" min="28" max="52" step="1"></div>
    <label class="row check"><input type="checkbox" id="showOrig"> 原文を併記する</label>
    <label class="row check"><input type="checkbox" id="showFigs"> 図を表示する</label>
    <p class="note">段落をタップすると原文を表示し、そこから読み上げます。</p>
  </div>
</section>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
